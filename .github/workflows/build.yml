# Builds OPM86 Player for macOS, Linux and Windows, runs the tests, and
# publishes the three apps as a GitHub release, when make release pushes a tag
# such as v0.2.0. For a pull request, or run by hand from the Actions tab, it
# builds and tests only, and keeps the apps as downloads on the run's page.
name: Build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-14
            configure: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: linux
            os: ubuntu-24.04
          - name: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux packages
        if: runner.os == 'Linux'
        run: sudo ./scripts/linux-deps.sh

      - name: Install Ninja
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5

      # The compiler cache, kept between runs, so a run recompiles only what changed.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}

      # Ninja on Windows needs the Visual Studio compiler's environment.
      - name: Set up the Visual Studio compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ matrix.configure }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: bash
        run: |
          out="build/opm86_player_artefacts/Release"
          case "${{ runner.os }}" in
            macOS) ditto -c -k --keepParent "$out/OPM86 Player.app" "OPM86-Player-macos.zip" ;;
            Linux) tar -czf "OPM86-Player-linux.tar.gz" -C "$out" "OPM86 Player" ;;
            Windows) 7z a "OPM86-Player-windows.zip" "./$out/OPM86 Player.exe" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: OPM86-Player-${{ matrix.name }}
          path: OPM86-Player-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # The release's notes are its section of CHANGELOG.md, which make release wrote.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v tag="${{ github.ref_name }}" '/^## / { on = ($2 == tag); next } on' CHANGELOG.md > notes.md
          gh release create "${{ github.ref_name }}" OPM86-Player-* --title "OPM86 Player ${{ github.ref_name }}" --notes-file notes.md
